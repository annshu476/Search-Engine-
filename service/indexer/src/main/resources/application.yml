server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: indexer

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:indexer}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.searchengine.indexer.model.kafka.SearchDocument
        spring.json.trusted.packages: com.searchengine.indexer.model.kafka
        spring.json.use.type.headers: false

    listener:
      ack-mode: manual_immediate
      concurrency: 1

indexer:
  elasticsearch:
    index-name: ${ELASTICSEARCH_INDEX_NAME:search-documents}
  kafka:
    search-document-topic: ${SEARCH_DOCUMENT_TOPIC:search-document-topic}
  search:
    max-results: ${SEARCH_MAX_RESULTS:10}
    max-page-size: ${SEARCH_MAX_PAGE_SIZE:50}
    max-query-length: ${SEARCH_MAX_QUERY_LENGTH:200}
    timeout: ${SEARCH_TIMEOUT:3s}
    max-page-depth: ${SEARCH_MAX_PAGE_DEPTH:10000}
    max-query-terms: ${SEARCH_MAX_QUERY_TERMS:20}
    max-query-phrases: ${SEARCH_MAX_QUERY_PHRASES:10}
    slow-query-threshold-ms: ${SEARCH_SLOW_QUERY_THRESHOLD_MS:1000}
    cache:
      enabled: ${SEARCH_CACHE_ENABLED:true}
      maximum-size: ${SEARCH_CACHE_MAXIMUM_SIZE:1000}
      ttl: ${SEARCH_CACHE_TTL:60s}
    analytics:
      enabled: ${SEARCH_ANALYTICS_ENABLED:true}
      maximum-query-entries: ${SEARCH_ANALYTICS_MAXIMUM_QUERY_ENTRIES:5000}
      top-query-limit: ${SEARCH_ANALYTICS_TOP_QUERY_LIMIT:20}
      query-retention: ${SEARCH_ANALYTICS_QUERY_RETENTION:1h}
    synonyms:
      enabled: ${SEARCH_SYNONYMS_ENABLED:true}
      maximum-synonyms-per-term: ${SEARCH_MAX_SYNONYMS_PER_TERM:5}
      rules:
        - "java, jdk"
        - "js, javascript"
        - "spring boot, springboot"
    spell-correction:
      enabled: ${SEARCH_SPELL_CORRECTION_ENABLED:true}
      maximum-suggestions: ${SEARCH_MAX_SPELL_SUGGESTIONS:3}
      minimum-term-length: ${SEARCH_SPELL_MIN_TERM_LENGTH:3}
    evaluation:
      enabled: ${SEARCH_EVALUATION_ENABLED:true}
      minimum-mrr: ${SEARCH_EVALUATION_MIN_MRR:0.80}
      minimum-hit-at-1: ${SEARCH_EVALUATION_MIN_HIT_AT_1:0.70}
      minimum-hit-at-3: ${SEARCH_EVALUATION_MIN_HIT_AT_3:0.90}
      minimum-recall-at-10: ${SEARCH_EVALUATION_MIN_RECALL_AT_10:0.95}
      maximum-zero-result-rate: ${SEARCH_EVALUATION_MAX_ZERO_RESULT_RATE:0.10}
    relevance:
      title-boost: ${SEARCH_TITLE_BOOST:4.0}
      headings-boost: ${SEARCH_HEADINGS_BOOST:3.0}
      meta-description-boost: ${SEARCH_META_DESCRIPTION_BOOST:2.0}
      body-boost: ${SEARCH_BODY_BOOST:1.0}
      phrase-boost: ${SEARCH_RELEVANCE_PHRASE_BOOST:2.0}
      title-phrase-boost: ${SEARCH_RELEVANCE_TITLE_PHRASE_BOOST:4.0}
    fuzzy:
      enabled: ${SEARCH_FUZZY_ENABLED:true}
      fuzziness: ${SEARCH_FUZZINESS:AUTO}
    highlight:
      enabled: ${SEARCH_HIGHLIGHT_ENABLED:true}
      fragment-size: ${SEARCH_HIGHLIGHT_FRAGMENT_SIZE:150}
      number-of-fragments: ${SEARCH_HIGHLIGHT_NUMBER_OF_FRAGMENTS:2}
      pre-tag: ${SEARCH_HIGHLIGHT_PRE_TAG:<em>}
      post-tag: ${SEARCH_HIGHLIGHT_POST_TAG:</em>}
    suggestions:
      enabled: ${SEARCH_SUGGESTIONS_ENABLED:true}
      max-results: ${SEARCH_SUGGESTIONS_MAX_RESULTS:8}
      min-prefix-length: ${SEARCH_SUGGESTIONS_MIN_PREFIX_LENGTH:2}

elasticsearch:
  url: ${ELASTICSEARCH_URL:http://localhost:9200}
  username: ${ELASTICSEARCH_USERNAME:}
  password: ${ELASTICSEARCH_PASSWORD:}
  connect-timeout-ms: ${ELASTICSEARCH_CONNECT_TIMEOUT_MS:5000}
  socket-timeout-ms: ${ELASTICSEARCH_SOCKET_TIMEOUT_MS:30000}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.searchengine.indexer: ${LOGGING_LEVEL_APPLICATION:INFO}

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    kafka:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

info:
  application:
    name: ${spring.application.name}
    description: Indexer service for the distributed search engine
