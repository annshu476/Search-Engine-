server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: url-frontier
  lifecycle:
    timeout-per-shutdown-phase: 20s

application:
  name: ${spring.application.name}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.searchengine.urlfrontier: ${LOGGING_LEVEL_APPLICATION:INFO}

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    kafka:
      enabled: false
    redis:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

info:
  application:
    name: ${spring.application.name}
    description: URL frontier service for the distributed search engine
