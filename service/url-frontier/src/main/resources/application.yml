server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: url-frontier
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: ${KAFKA_PRODUCER_RETRIES:3}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        retry.backoff.ms: ${KAFKA_PRODUCER_RETRY_BACKOFF_MS:200}
        request.timeout.ms: ${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:2000}
        delivery.timeout.ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:5000}
        max.block.ms: ${KAFKA_PRODUCER_MAX_BLOCK_MS:3000}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:url-frontier-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.searchengine.urlfrontier.model.kafka.DiscoveredUrl
        spring.json.trusted.packages: com.searchengine.urlfrontier.model.kafka,com.searchengine.contentprocessor.model.kafka
        spring.json.use.type.headers: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

application:
  name: ${spring.application.name}
  kafka:
    url-task:
      topic: ${URL_TASK_TOPIC:url-topic}
      publish-timeout: ${URL_TASK_PUBLISH_TIMEOUT:3s}
    discovered-urls-topic: ${DISCOVERED_URLS_TOPIC:discovered-urls-topic}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.searchengine.urlfrontier: ${LOGGING_LEVEL_APPLICATION:INFO}

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    kafka:
      enabled: false
    redis:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

info:
  application:
    name: ${spring.application.name}
    description: URL frontier service for the distributed search engine

