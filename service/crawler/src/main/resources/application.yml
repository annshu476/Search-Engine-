server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: crawler
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:crawler-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.searchengine.crawler.model.kafka.UrlTask
        spring.json.trusted.packages: "com.searchengine.crawler.model.kafka"
        spring.json.use.type.headers: false
    listener:
      ack-mode: manual_immediate
      concurrency: 1
  lifecycle:
    timeout-per-shutdown-phase: 20s

crawler:
  http:
    user-agent: ${CRAWLER_USER_AGENT:SearchEngineBot/1.0}
    connect-timeout: ${CRAWLER_CONNECT_TIMEOUT:5s}
    response-timeout: ${CRAWLER_RESPONSE_TIMEOUT:10s}
    max-response-size: ${CRAWLER_MAX_RESPONSE_SIZE:10MB}
    max-redirects: ${CRAWLER_MAX_REDIRECTS:5}
    ssrf-protection-enabled: ${CRAWLER_SSRF_PROTECTION_ENABLED:true}
  robots:
    cache-ttl: ${CRAWLER_ROBOTS_CACHE_TTL:1h}
    cache-max-size: ${CRAWLER_ROBOTS_CACHE_MAX_SIZE:1000}
    max-response-size: ${CRAWLER_ROBOTS_MAX_RESPONSE_SIZE:1MB}
    timeout: ${CRAWLER_ROBOTS_TIMEOUT:5s}

application:
  name: ${spring.application.name}
  kafka:
    url-task:
      topic: ${URL_TASK_TOPIC:url-topic}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.searchengine.crawler: ${LOGGING_LEVEL_APPLICATION:INFO}

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    kafka:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

info:
  application:
    name: ${spring.application.name}
    description: Crawler service for the distributed search engine
